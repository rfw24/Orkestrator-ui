<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Godot UI Orchestrator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Panel Kiri: Interaksi AI -->
        <div class="panel controls-panel">
            <h2>Prompt Middleware</h2>
            <textarea id="userInput" placeholder="Masukkan deskripsi logika menu (Contoh: Tombol dengan animasi Tween)"></textarea>
            <button id="btnGenerate">Eksekusi Kode</button>
            
            <div class="feedback-section" id="mode2" style="display: none;">
                <p>Beri nilai performa fungsi ini:</p>
                <div class="rating-buttons">
                    <button class="btn-rate" data-score="1">1 (Buruk)</button>
                    <button class="btn-rate" data-score="3">3 (Standar)</button>
                    <button class="btn-rate" data-score="5">5 (Sempurna)</button>
                </div>
            </div>
        </div>

        <!-- Panel Kanan: Proyektor Sandbox Godot -->
        <div class="panel sandbox-panel">
            <iframe id="godotFrame" src="about:blank" title="Godot Sandbox Preview"></iframe>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
